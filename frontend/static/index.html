<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCoach AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root { 
    --accent: #FF5500; 
    --accent-hover: #E04800;
    --accent-gradient: linear-gradient(135deg, #FF5500 0%, #FF2200 100%);
    --bg: #F8FAFC; 
    --surface: #FFFFFF;
    --border: #E2E8F0; 
    --text-primary: #0F172A;
    --text-secondary: #64748B;
  }
  * { box-sizing: border-box; }
  body { 
    margin: 0; 
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    color: var(--text-primary);
  }
  header { 
    background: var(--accent-gradient); 
    color: #fff; 
    padding: 1rem 1.5rem; 
    display: flex;
    align-items: center;
    gap: 0.75rem;
    box-shadow: 0 4px 12px rgba(255, 85, 0, 0.2);
    z-index: 10;
  }
  header .header-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  header .header-subtitle {
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 400;
  }
  header .logo-icon {
    font-size: 1.75rem;
    background: rgba(255,255,255,0.2);
    padding: 0.4rem;
    border-radius: 10px;
  }

  #log { 
    flex: 1; 
    overflow-y: auto; 
    padding: 1.5rem; 
    max-width: 820px; 
    width: 100%; 
    margin: 0 auto; 
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  
  /* Dialogue Message Layout */
  .msg { 
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    animation: fadeIn 0.25s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { 
    flex-direction: row-reverse; 
  }
  
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .msg.agent .avatar {
    background: #FF55001A;
    color: var(--accent);
    border: 1px solid #FF550033;
  }
  .msg.user .avatar {
    background: #0F172A;
    color: #fff;
  }

  .bubble-container {
    max-width: 82%;
    display: flex;
    flex-direction: column;
  }

  .bubble { 
    padding: 0.85rem 1.1rem; 
    border-radius: 18px; 
    background: var(--surface); 
    border: 1px solid var(--border); 
    text-align: left; 
    line-height: 1.5;
    font-size: 0.975rem;
    white-space: pre-wrap; 
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
    color: var(--text-primary);
  }
  .msg.user .bubble { 
    background: var(--accent-gradient); 
    color: #fff; 
    border: none; 
    border-top-right-radius: 4px;
    box-shadow: 0 3px 10px rgba(255, 85, 0, 0.25);
  }

  /* Rich A2UI Card Display */
  .bubble.rich { 
    background: transparent; 
    border: none; 
    padding: 0; 
    max-width: 100%; 
    white-space: normal; 
    box-shadow: none;
  }

  /* Input Form Area */
  form { 
    display: flex; 
    gap: 0.75rem; 
    padding: 1.25rem 1.5rem; 
    border-top: 1px solid var(--border); 
    background: var(--surface); 
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  input { 
    flex: 1; 
    padding: 0.85rem 1.25rem; 
    border: 1.5px solid var(--border); 
    border-radius: 24px; 
    font-size: 0.975rem; 
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: var(--bg);
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255, 85, 0, 0.15);
    background: #fff;
  }
  button { 
    padding: 0.85rem 1.5rem; 
    border: none; 
    border-radius: 24px; 
    background: var(--accent-gradient); 
    color: #fff; 
    font-weight: 600; 
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer; 
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 3px 10px rgba(255, 85, 0, 0.25);
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(255, 85, 0, 0.35);
  }
  button:active {
    transform: translateY(0);
  }

  /* A2UI card enhancements */
  .a2card { 
    border: 1px solid var(--border); 
    border-radius: 16px; 
    padding: 1.25rem; 
    background: var(--surface); 
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05); 
    max-width: 100%; 
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; margin-top: 0.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="material-symbols-outlined logo-icon">fitness_center</span>
  <div>
    <div class="header-title">FitCoach AI</div>
    <div class="header-subtitle">Personal Fitness &amp; Workout Coach</div>
  </div>
</header>

<div id="log"></div>

<form id="form">
  <input id="input" placeholder="Ask FitCoach anything (e.g. exercises, 1RM, logs)..." autocomplete="off" autofocus>
  <button>
    <span>Send</span>
    <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
  </button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const av = el("div", "avatar");
  const icon = el("span", "material-symbols-outlined", who === "agent" ? "smart_toy" : "person");
  av.appendChild(icon);
  
  const container = el("div", "bubble-container");
  const b = el("div", "bubble");
  container.appendChild(b);
  
  m.appendChild(av);
  m.appendChild(container);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
